<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeoutException</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <div class="progress-container">
        <svg class="progress-ring" width="300" height="300" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6C5CE7" />
              <stop offset="35%" stop-color="#4892DC" />
              <stop offset="50%" stop-color="#00FFC6" />
              <stop offset="100%" stop-color="#00FFC6" />
            </linearGradient>

            <filter id="neonGlowThick" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="19" result="blur_wide" />
              <feComponentTransfer in="blur_wide" result="glow_fade">
                <feFuncA type="linear" slope="0.4" />
              </feComponentTransfer>

              <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur_mid" />
              <feComponentTransfer in="blur_mid" result="glow_mid">
                <feFuncA type="linear" slope="0.7" />
              </feComponentTransfer>

              <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur_sharp" />

              <feMerge>
                <feMergeNode in="glow_fade" />
                <feMergeNode in="glow_mid" />
                <feMergeNode in="blur_sharp" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Цятки -->
          <circle
            class="ticks"
            cx="50" cy="50" r="48"
            fill="none"
            stroke="rgba(255, 255, 255, 0.25)"
            stroke-width="1"
            stroke-linecap="round"
            stroke-dasharray="0.01 12.56"
            transform="rotate(-90 50 50)"
          />

          <!-- Прогрес-бар -->
          <circle
            class="progress-circle"
            cx="50" cy="50" r="42"
            fill="none"
            stroke="url(#progressGradient)"
            stroke-width="1.5"
            stroke-linecap="round"
            filter="url(#neonGlowThick)"
            transform="rotate(-90 50 50)"
            stroke-dasharray="263.89"
            stroke-dashoffset="65"
          />
        </svg>

        <div class="timer-content">
          <div class="timer-text">15:00</div>
          <div class="timer-label">BREAK</div>

          <button class="timer-button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 5v14l11-7z" fill="currentColor"/>
            </svg>

            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/>
              <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Іконка Налаштувань в лівому нижньому куті вікна -->
      <button class="corner-icon-btn settings-btn" title="Налаштування" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>

      <!-- Нова красива іконка Кубка в правому нижньому куті вікна -->
      <button class="corner-icon-btn trophy-btn" title="Досягнення" aria-label="Achievements">
        <svg viewBox="3 4 26 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22.786 6c0 0 .715-1 2.214-1 1.377 0 3 1.05 3 3 0 3.21-5 4.242-5 8 0 .982 1 1.993 1 1.993" />
          <path d="M8 17.993c0 0 1-1.011 1-1.993 0-3.758-5-4.79-5-8 0-1.95 1.623-3 3-3 1.498 0 2.214 1 2.214 1" />
          <path d="M9 6c0 6.528 3.689 17 6.983 17S23 12.568 23 6H9z" />
          <path d="M18 24h-4c-1.657 0-3 1.343-3 3v0h10v0c0-1.657-1.343-3-3-3z" />
        </svg>
      </button>
    </main>
  </body>
</html>
